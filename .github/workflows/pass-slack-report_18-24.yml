name: PASS Slack Report 18-24 JST

on:
  schedule:
    # GitHub Actions cron is UTC.
    # 09:03-14:58 UTC = 18:03-23:58 JST.
    # Run every 5 minutes during the 18:00-24:00 JST window.
    - cron: "3,13,23,33,43,53 9-13 * * *"

  workflow_dispatch:
    inputs:
      date_ymd:
        description: "Target date in Asia/Tokyo. Empty means JST tomorrow."
        required: false
        default: ""
      operation_min_elevation_deg:
        description: "MEL threshold."
        required: false
        default: "10"
      force_send:
        description: "Send even if already sent marker exists."
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      slack_target:
        description: "Slack target."
        required: false
        default: "test"
        type: choice
        options:
          - "test"
          - "prod"

permissions:
  contents: write

concurrency:
  # Keep a single concurrency group for both schedule and manual runs.
  # With cancel-in-progress: false, a running report is not killed;
  # extra pending runs in the same group are replaced instead of piling up.
  group: pass-slack-report-18jst
  cancel-in-progress: false

jobs:
  send-report:
    runs-on: ubuntu-latest

    steps:
      - name: Show trigger
        run: |
          echo "event_name=${{ github.event_name }}"
          echo "schedule=${{ github.event.schedule }}"
          echo "actor=${{ github.actor }}"
          echo "ref=${{ github.ref }}"
          echo "sha=${{ github.sha }}"
          date -u

      - name: Checkout
        uses: actions/checkout@v5

      - name: Sync latest main for scheduled runs
        if: github.event_name == 'schedule'
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Update TLE once per JST day
        run: |
          set -euo pipefail

          TODAY="$(TZ=Asia/Tokyo date +%F)"
          MARKER="reports/tle-updated/${TODAY}.json"

          if [ -f "$MARKER" ]; then
            echo "TLE already checked today: $MARKER"
            exit 0
          fi

          npm run update-tle

          mkdir -p reports/tle-updated
          printf '{\n  "date": "%s",\n  "updated_at_utc": "%s"\n}\n' "$TODAY" "$(date -u +%FT%TZ)" > "$MARKER"

      - name: Send PASS report to Slack
        env:
          INPUT_DATE_YMD: ${{ github.event.inputs.date_ymd || '' }}
          INPUT_FORCE_SEND: ${{ github.event.inputs.force_send || 'false' }}
          INPUT_SLACK_TARGET: ${{ github.event.inputs.slack_target || 'prod' }}
          SLACK_BOT_TOKEN_TEST: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID_TEST: ${{ secrets.SLACK_CHANNEL_ID }}
          SLACK_BOT_TOKEN_PROD: ${{ secrets.SLACK_BOT_TOKEN_1 }}
          SLACK_CHANNEL_ID_PROD: ${{ secrets.SLACK_CHANNEL_ID_1 }}
          PASS_OPERATION_MIN_ELEVATION_DEG: ${{ github.event.inputs.operation_min_elevation_deg || vars.PASS_OPERATION_MIN_ELEVATION_DEG || '10' }}
        run: |
          set -euo pipefail

          TARGET_DATE="${INPUT_DATE_YMD:-}"

          if [ -z "$TARGET_DATE" ]; then
            TARGET_DATE="$(TZ=Asia/Tokyo date -d 'tomorrow' +%F)"
          fi

          if [ "${INPUT_FORCE_SEND:-false}" = "true" ]; then
            PASS_FORCE_SEND=true
          else
            PASS_FORCE_SEND=false
          fi

          SLACK_TARGET="${INPUT_SLACK_TARGET:-prod}"

          if [ "$SLACK_TARGET" = "test" ]; then
            export SLACK_BOT_TOKEN="$SLACK_BOT_TOKEN_TEST"
            export SLACK_CHANNEL_ID="$SLACK_CHANNEL_ID_TEST"
            export PASS_TEST_MODE=true
            echo "Slack target: test"
          else
            export SLACK_BOT_TOKEN="$SLACK_BOT_TOKEN_PROD"
            export SLACK_CHANNEL_ID="$SLACK_CHANNEL_ID_PROD"
            export PASS_TEST_MODE=false
            echo "Slack target: prod"
          fi

          if [ -z "${SLACK_BOT_TOKEN:-}" ] || [ -z "${SLACK_CHANNEL_ID:-}" ]; then
            echo "Slack token or channel ID is empty."
            exit 1
          fi

          echo "Target date: $TARGET_DATE"
          echo "Force send: $PASS_FORCE_SEND"
          echo "MEL threshold: $PASS_OPERATION_MIN_ELEVATION_DEG"

          PASS_REPORT_DATE_YMD="$TARGET_DATE" \
          PASS_FORCE_SEND="$PASS_FORCE_SEND" \
          PASS_SKIP_LOS_CHECK=true \
          npm run send-pass-report

      - name: Commit TLE/report markers if changed
        run: |
          set -euo pipefail

          if git diff --quiet -- public/tle reports; then
            echo "No TLE/report marker changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public/tle reports
          git commit -m "Update TLE or PASS report marker"
          git pull --rebase origin main
          git push origin HEAD:main
