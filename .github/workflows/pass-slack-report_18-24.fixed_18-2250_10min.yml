name: PASS Slack Report 18 JST

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    - cron: "7 18 * * *"
      timezone: "Asia/Tokyo"
    - cron: "23 18 * * *"
      timezone: "Asia/Tokyo"

  workflow_dispatch:
    inputs:
      operation_min_elevation_deg:
        description: "MEL threshold."
        required: false
        default: "10"
      date_ymd:
        description: "Target report date in Asia/Tokyo. Empty means JST tomorrow."
        required: false
        default: ""
      force_send:
        description: "true = send even if already sent marker exists."
        required: false
        default: "false"
      slack_target:
        description: "test or prod."
        required: false
        default: "test"

permissions:
  contents: write

concurrency:
  group: pass-slack-report
  cancel-in-progress: false

jobs:
  send-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve report date
        id: report_date
        env:
          INPUT_DATE_YMD: ${{ github.event.inputs.date_ymd || '' }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${INPUT_DATE_YMD:-}" ]; then
            REPORT_DATE="$INPUT_DATE_YMD"
          else
            REPORT_DATE="$(TZ=Asia/Tokyo date -d 'tomorrow' +%F)"
          fi

          TLE_MARKER="reports/tle-updated/${REPORT_DATE}.json"
          SENT_MARKER="reports/sent/${REPORT_DATE}.json"

          echo "report_date=$REPORT_DATE" >> "$GITHUB_OUTPUT"
          echo "tle_marker=$TLE_MARKER" >> "$GITHUB_OUTPUT"
          echo "sent_marker=$SENT_MARKER" >> "$GITHUB_OUTPUT"

          echo "Report date: $REPORT_DATE"
          echo "TLE marker:  $TLE_MARKER"
          echo "Sent marker: $SENT_MARKER"

      - name: Update TLE once per report date
        shell: bash
        run: |
          set -euo pipefail

          REPORT_DATE="${{ steps.report_date.outputs.report_date }}"
          MARKER="${{ steps.report_date.outputs.tle_marker }}"

          if [ -f "$MARKER" ]; then
            echo "TLE already checked for report date: $MARKER"
            exit 0
          fi

          node scripts/update-tle.mjs

          mkdir -p reports/tle-updated

          printf '{\n  "date": "%s",\n  "report_date": "%s",\n  "updated_at_utc": "%s",\n  "purpose": "scheduled-18jst-next-day-report",\n  "workflow_run": "%s"\n}\n' \
            "$REPORT_DATE" \
            "$REPORT_DATE" \
            "$(date -u +%FT%TZ)" \
            "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            > "$MARKER"

      - name: Send PASS report to Slack
        env:
          REPORT_DATE: ${{ steps.report_date.outputs.report_date }}
          INPUT_FORCE_SEND: ${{ github.event.inputs.force_send || 'false' }}
          INPUT_SLACK_TARGET: ${{ github.event.inputs.slack_target || 'prod' }}

          SLACK_BOT_TOKEN_TEST: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID_TEST: ${{ secrets.SLACK_CHANNEL_ID }}
          SLACK_BOT_TOKEN_PROD: ${{ secrets.SLACK_BOT_TOKEN_1 }}
          SLACK_CHANNEL_ID_PROD: ${{ secrets.SLACK_CHANNEL_ID_1 }}

          PASS_OPERATION_MIN_ELEVATION_DEG: ${{ github.event.inputs.operation_min_elevation_deg || vars.PASS_OPERATION_MIN_ELEVATION_DEG || '10' }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "${INPUT_FORCE_SEND:-false}" = "true" ]; then
            PASS_FORCE_SEND=true
          else
            PASS_FORCE_SEND=false
          fi

          SLACK_TARGET="${INPUT_SLACK_TARGET:-prod}"

          if [ "$SLACK_TARGET" = "test" ]; then
            export SLACK_BOT_TOKEN="$SLACK_BOT_TOKEN_TEST"
            export SLACK_CHANNEL_ID="$SLACK_CHANNEL_ID_TEST"
            export PASS_TEST_MODE=true
          else
            export SLACK_BOT_TOKEN="$SLACK_BOT_TOKEN_PROD"
            export SLACK_CHANNEL_ID="$SLACK_CHANNEL_ID_PROD"
            export PASS_TEST_MODE=false
          fi

          if [ -z "${SLACK_BOT_TOKEN:-}" ] || [ -z "${SLACK_CHANNEL_ID:-}" ]; then
            echo "Slack token or channel ID is empty."
            exit 1
          fi

          PASS_REPORT_DATE_YMD="$REPORT_DATE" \
          PASS_FORCE_SEND="$PASS_FORCE_SEND" \
          PASS_SEND_REASON="18 JST scheduled next-day report" \
          PASS_SKIP_LOS_CHECK=true \
          node scripts/send-pass-report.mjs

      - name: Commit TLE/report markers if changed
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- public/tle reports; then
            echo "No TLE/report marker changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public/tle reports
          git commit -m "Update TLE and PASS report markers"

          git pull --rebase origin main
          git push origin HEAD:main
