name: PASS Slack Report 18 JST

on:
  schedule:
    - cron: "7 9 * * *"
    - cron: "23 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  send-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Update TLE
        run: npm run update-tle

      - name: Send PASS report to Slack
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN_1 }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID_1 }}
          PASS_REPORT_DATE_YMD: ""
          PASS_FORCE_SEND: "false"
          PASS_SKIP_LOS_CHECK: "true"
        run: |
          set -euo pipefail
          TARGET_DATE="$(TZ=Asia/Tokyo date -d 'tomorrow' +%F)"
          PASS_REPORT_DATE_YMD="$TARGET_DATE" npm run send-pass-report
